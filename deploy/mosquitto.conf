# ==============================================================================
# mosquitto 설정 (데모용)
# ==============================================================================
# 대상 코드가 접속하는 값과 일치:
#   broker=localhost port=1883 topic=bed/bed-01/sensor

listener 1883 0.0.0.0

# ⚠️ 데모용 익명 접속 허용. 운영 환경에서는 반드시 인증(password_file) +
#   TLS 적용, allow_anonymous false 로 바꿀 것.
allow_anonymous true

persistence true
persistence_location /mosquitto/data/

log_dest stdout
